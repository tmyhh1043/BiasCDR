metrics: [MRR, Recall, NDCG, Hit]
topk: [10, 20]
valid_metric: Recall@20
lr_scheduler: none
scheduler_metric: NDCG@10
scheduler_mode: max
scheduler_factor: 0.5
scheduler_patience: 5
scheduler_min_lr: 1.0e-6
eval_step: 1
stopping_step: 10
test_extra_metrics: true
test_popularity_breakdown: true
popularity_head_ratio: 0.2
popularity_middle_ratio: 0.0
test_long_tail_coverage: true
long_tail_item_ratio: 0.8
evaluate_extra_metrics_on_valid: true
