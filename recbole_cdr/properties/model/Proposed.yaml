# ==========================================
# Model Architecture
# ==========================================
embedding_size: 64
n_layers: 3

# ==========================================
# Proposed Method Hyperparameters
# ==========================================
# Sport item features are loaded from source_domain.text_feat_file and
# source_domain.visual_feat_file. Their dimensions are detected from .npy.
# Reuse profiles computed from source training interactions across runs.
source_mm_cache_enabled: true
source_mm_cache_dir: saved/mm_feature_cache
gamma: 2.0                # 転移重み(Selective-CL)の減衰スケール
beta: 0.5                 # ハイブリッドリスクのバランス (0.5で因果的依存度と意味的乖離度を等価に扱う)
tau: 0.1                  # InfoNCEおよび因果的バイアス依存度計算用の温度パラメータ

# ==========================================
# Loss Weights (Objective Function)
# ==========================================
lambda_cl: 0.01         # メインのBPRの邪魔をしないよう少し下げる
lambda_orth: 0.005      # 同上
lambda_multi: 0.05        # マルチモーダルアライメント損失の重み
lambda_pop: 0.01       # 長尾アイテムの推薦精度を改善するためのポピュラリティ損失の重み

# ==========================================
# Experiment & Metrics Logging
# ==========================================
# Columns written by the fixed-seed parameter-analysis scripts.
metrics_csv_param_keys:
  - experiment_tag
  - seed
  - learning_rate
  - gamma
  - beta
  - tau
  - lambda_cl
  - lambda_pop
  - lambda_orth
  - lambda_multi

# ==========================================
# Training Settings
# ==========================================
learning_rate: 0.001
train_epochs: ["BOTH:200"]  # SourceとTargetを同時学習
valid_start_epoch: 20
train_batch_size: 2048

train_neg_sample_args:
  strategy: by
  by: 1
  distribution: uniform
  dynamic: none

# ==========================================
# Evaluation Settings
# ==========================================
# Target-domain full-sort ranking evaluation.
topk: [10, 20, 30]
record_valid_popularity_each_epoch: false
valid_extra_metrics_batch_size: 256
long_tail_item_ratio: 0.8
# Optional per-epoch CSV output:
# valid_epoch_metrics_csv_path: results/proposed_valid_epoch_metrics.csv
eval_neg_sample_args:
  strategy: full
  distribution: uniform

eval_batch_size: 5000000
full_sort_chunk_size: 8192
fast_full_sort_eval: true
